<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:#111;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  overflow:hidden;
}

.page{
  position:relative;
  width:100%;
  height:100svh;
  min-height:560px;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  overflow:hidden;
  background:#181818;
}

.bg-video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  z-index:0;
  filter:saturate(.92) contrast(.98);
}

.overlay{
  position:absolute;
  inset:0;
  z-index:1;
  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.08) 0%,
      rgba(0,0,0,.12) 38%,
      rgba(0,0,0,.68) 100%
    );
}

.content{
  position:relative;
  z-index:2;
  width:min(100% - 30px,520px);
  padding:0;
  text-align:center;
  position:absolute;
  top:61%;
  left:50%;
  transform:translate(-50%,-50%);

  color:#fff;
  animation:fadeUp .8s ease both;
}

.eyebrow{
  display:inline-block;
  margin-bottom:10px;
  padding:7px 12px;
  border:1px solid rgba(255,255,255,.28);
  border-radius:999px;
  background:rgba(255,255,255,.10);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  font-size:11px;
  letter-spacing:1.5px;
  text-transform:uppercase;
}

h1{
  margin:0;
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(32px,8vw,48px);
  line-height:1.05;
  font-weight:500;
  letter-spacing:-1px;
  text-shadow:0 3px 18px rgba(0,0,0,.35);
}

.message{
  margin:10px auto 22px;
  max-width:390px;
  font-size:15px;
  line-height:1.45;
  color:rgba(255,255,255,.92);
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  width:100%;
}

.btn{
  appearance:none;
  border:0;
  min-height:54px;
  border-radius:14px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  text-decoration:none;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:transform .18s ease,opacity .18s ease;
}

.btn:active{
  transform:scale(.97);
}

.no{
  color:#242022;
  background:rgba(255,255,255,.94);
}

.yes{
  color:#fff;
  background:rgba(226,65,105,.96);
  box-shadow:0 8px 25px rgba(0,0,0,.18);
}

.hint{
  margin-top:13px;
  font-size:10px;
  color:rgba(255,255,255,.62);
}

@keyframes fadeUp{
  from{opacity:0;transform:translate(-50%,calc(-50% + 18px))}
  to{opacity:1;transform:translate(-50%,-50%)}
}

@media(max-width:420px){
  .content{
    width:calc(100% - 24px);
    top:58%;
  }

  h1{font-size:34px}
  .message{font-size:14px;margin-bottom:18px}
  .btn{min-height:52px}
}
</style>
</head>

<body>

<main class="page">

  <!-- Replace video.mp4 with your own licensed/authorized video -->
  <video class="bg-video"
         autoplay
         muted
         loop
         playsinline
         preload="metadata"
         poster="b.png">
    <source src="video.mp4" type="video/mp4">
  </video>

  <div class="overlay"></div>

  <section class="content">

    <div class="eyebrow">A little something</div>

    <h1>Someone caught your attention. ♡</h1>

    <p class="message">
      Sometimes the best conversations start unexpectedly.
    </p>

    <div class="actions">
      <button class="btn no" type="button" onclick="this.closest('.content').style.opacity='.45'">
        NOT NOW
      </button>

      <a class="btn yes"
         href="https://demalz.sweetgirll.com/?utm_source=da57dc555e50572d&ban=inst&j1=1&s1=252812&s2=2270588&s3=LPpremium&click_id=private"
         rel="nofollow">
        LET'S CONNECT →
      </a>
    </div>

    <div class="hint">Take a look • You never know</div>

  </section>

</main>

</body>
</html>
